name: clothing_app
description: Mini clothing e-commerce mobile frontend
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'   # Adjust according to your flutter doctor output

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # ── State / DI / Routing ──
  get: ^4.7.2                    # GetX: reactive state, DI, navigation

  # ── Networking ──
  dio: ^5.7.0                    # REST API communication

  # ── Local Storage ──
  shared_preferences: ^2.3.3    # Non-sensitive preferences
  flutter_secure_storage: ^9.2.2 # Auth token secure storage

  # ── Firebase / Push Notifications ──
  firebase_core: ^3.6.0          # Firebase initialization
  firebase_messaging: ^15.1.3    # FCM token registration & push
  flutter_local_notifications: ^17.2.3 # Foreground notification display

  # ── Location / Maps ──
  geolocator: ^14.0.2            # Device location & permissions
  google_maps_flutter: ^2.18.1   # Map-based address picker
  geocoding: ^3.0.0              # Coordinate ↔ address conversion

  # ── Media ──
  image_picker: ^1.1.2           # Avatar selection from gallery

  # ── Receipts / PDF ──
  pdf: ^3.11.1                   # PDF generation
  printing: ^5.13.4              # Preview / print / share PDF
  share_plus: ^10.1.2            # Native share dialog
  firebase_dart: ^1.6.2
  flutter_native_splash: ^2.4.7
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0
  provider: ^6.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
  flutter_native_html_to_pdf: ^3.1.0
  path_provider: ^2.1.6
  country_code_picker_plus: ^0.1.0+1
  country_codes: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0          # Lint rules
  mocktail: ^1.0.4               # Testing mocks
  flutter_flavorizr: ^2.3.0      # Flavor generation (dev only)
  flutter_launcher_icons: ^0.14.1 # App icon generation (dev only)
  build_runner: ^2.4.13          # Code generation (optional, for json_serializable)
  json_serializable: ^6.9.0      # DTO code generation (optional)

# image 4.11.0 uses ZLibDecoder.decodeLazy, added to archive in 4.4.0.
# flutter_flavorizr brings image transitively, while the current lockfile
# otherwise selects archive 4.0.9, which does not provide that API.
dependency_overrides:
  archive: ^4.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/templates/receipt.html
